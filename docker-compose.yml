services:
  postgres:
    image: postgres:17-alpine
    container_name: scotland-yard-live-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: scotland_yard
      POSTGRES_PASSWORD: scotland_yard_dev
      POSTGRES_DB: scotland_yard
    ports:
      - '5433:5432'
    volumes:
      - scotland_yard_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U scotland_yard -d scotland_yard']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  scotland_yard_postgres_data:
